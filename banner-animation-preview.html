<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Banner Animation - Record This!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Banner container - 1920x600 for recording */
    .banner-container {
      width: 1920px;
      height: 600px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    /* ATM Logo on the left */
    .atm-logo {
      position: absolute;
      left: 5%;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(255, 214, 10, 0.4));
      animation: logoGlow 3s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { 
        filter: drop-shadow(0 0 20px rgba(255, 214, 10, 0.4));
      }
      50% { 
        filter: drop-shadow(0 0 40px rgba(255, 214, 10, 0.6)) drop-shadow(0 0 60px rgba(0, 166, 251, 0.3));
      }
    }

    /* Right section with text and light bulbs */
    .right-section {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* Center content container */
    .center-content {
      position: absolute;
      left: 22%;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    /* Row of light bulbs - spread across banner */
    .lightbulb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 20px;
    }

    /* Individual light bulbs */
    .bulb {
      font-size: 70px;
      transition: all 0.5s ease;
      filter: brightness(0.2) grayscale(1);
      opacity: 0.3;
    }

    /* Light bulbs turn on progressively with increasing brightness */
    .bulb.on:nth-child(1) {
      filter: brightness(0.4) grayscale(0.8);
      opacity: 0.5;
    }

    .bulb.on:nth-child(2) {
      filter: brightness(0.55) grayscale(0.6);
      opacity: 0.6;
    }

    .bulb.on:nth-child(3) {
      filter: brightness(0.7) grayscale(0.4);
      opacity: 0.75;
    }

    .bulb.on:nth-child(4) {
      filter: brightness(0.85) grayscale(0.2);
      opacity: 0.85;
    }

    .bulb.on:nth-child(5) {
      filter: brightness(1) grayscale(0);
      opacity: 0.95;
    }

    .bulb.on:nth-child(6) {
      filter: brightness(1.2) grayscale(0) drop-shadow(0 0 30px rgba(255, 214, 10, 0.6));
      opacity: 1;
    }

    /* Last bulb - maximum glow */
    .bulb.on:nth-child(7) {
      filter: brightness(1.4) grayscale(0) drop-shadow(0 0 50px rgba(255, 214, 10, 1)) drop-shadow(0 0 80px rgba(255, 214, 10, 0.8));
      opacity: 1;
      animation: finalBulbPulse 2s ease-in-out infinite;
    }

    @keyframes finalBulbPulse {
      0%, 100% {
        filter: brightness(1.4) drop-shadow(0 0 50px rgba(255, 214, 10, 1)) drop-shadow(0 0 80px rgba(255, 214, 10, 0.8));
        transform: scale(1);
      }
      50% {
        filter: brightness(1.6) drop-shadow(0 0 70px rgba(255, 214, 10, 1)) drop-shadow(0 0 120px rgba(255, 214, 10, 1));
        transform: scale(1.08);
      }
    }

    /* Main text underneath bulbs - single line */
    .main-text {
      text-align: center;
      line-height: 1.2;
      width: 100%;
    }

    .main-text h1 {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      margin: 0;
      white-space: nowrap;
    }

    .main-text .gold-text {
      color: #FFD60A;
      font-style: italic;
      text-shadow: 0 0 30px rgba(255, 214, 10, 0.6);
    }

  </style>
</head>
<body>

  <!-- Banner Container (1920x600) -->
  <div class="banner-container">
    
    <!-- ATM Logo on Left -->
    <img src="images/atm-logo.png" alt="AntiTrollMovement Logo" class="atm-logo">

    <!-- Center Content: Bulbs and Text -->
    <div class="center-content">
      <!-- Light Bulb Row -->
      <div class="lightbulb-row" id="lightbulbRow">
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
        <div class="bulb">💡</div>
      </div>

      <!-- Main Text (underneath bulbs) -->
      <div class="main-text">
        <h1>
          ✊ The internet isn't broken 🔄 <span class="gold-text">it just needs someone to switch on the light.</span> 💡
        </h1>
      </div>
    </div>

  </div>

  <script>
    // Auto light animation
    const bulbs = document.querySelectorAll('.bulb');

    // Function to turn lights on progressively
    function turnLightsOn() {
      // Turn on each bulb with a delay
      bulbs.forEach((bulb, index) => {
        setTimeout(() => {
          bulb.classList.add('on');
        }, index * 200); // 200ms delay between each bulb
      });
    }

    // Auto-start animation after 1 second
    setTimeout(() => {
      turnLightsOn();
    }, 1000);
  </script>

</body>
</html>
