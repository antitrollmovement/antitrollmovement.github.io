<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Frames | AntiTrollMovement</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>

 <!-- Navigation Bar -->
<div id="navbar"></div>
<script>
  fetch("/includes/header.html")
    .then(res => res.text())
    .then(html => document.getElementById("navbar").innerHTML = html);
</script>



  <main class="container">
 <h1>💫 The Five Frames</h1>
<p>Each frame represents a value a way to show who you are and what you stand for.  
They’re not filters. They’re symbols of empathy, courage, and light.</p>

<div class="frame-gallery">

  <div class="frame-overlay" data-desc="For those who show kindness and stand up for others.">
   <img src="../images/atmally.png" alt="ATM Ally Frame">
  </div>

  <div class="frame-overlay" data-desc="For those flipping negativity into awareness and truth.">
    <img src="../images/atmambassador.png" alt="ATM Ambassador Frame">
  </div>

  <div class="frame-overlay" data-desc="For voices that kept going when it was hardest to.">
    <img src="../images/atmsurvivor.png" alt="ATM Survivor Frame">
  </div>

  <div class="frame-overlay" data-desc="For those shaping culture with insight and empathy.">
    <img src="../images/atmthoughtleader.png" alt="ATM Thought Leader Frame">
  </div>

  <div class="frame-overlay" data-desc="For the builders — creating safer digital spaces.">
    <img src="../images/atmarchitect.png" alt="ATM Architect Frame">
  </div>


<p><em>Every frame is a statement.  
Not about who you are online but what kind of energy you leave behind. 💡</em></p>
<a class="button" href="#">✨ Try a Frame</a>
    </div>

   <script>
document.addEventListener("DOMContentLoaded", () => {
  const frames = document.querySelectorAll(".frame-overlay");

  function updateFlips() {
    const flipThreshold = window.innerHeight * 0.75; // bottom 25% of viewport
    frames.forEach(frame => {
      const rect = frame.getBoundingClientRect();
      if (rect.bottom > flipThreshold) {
        frame.classList.add("flip-up");
      } else {
        frame.classList.remove("flip-up");
      }
    });
  }

  // Initial check
  updateFlips();

  // Recalculate on resize or scroll
  window.addEventListener("resize", updateFlips);
  window.addEventListener("scroll", updateFlips);
});
</script>


</body>
</html>
