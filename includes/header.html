<style>
  /* Mobile responsive styles for header */
  @media (max-width: 768px) {
    .navbar { position: relative; }
    .navbar-container { position: relative; }
    .menu-toggle { display: block; }

    .navbar-container ul {
      display: none; /* Hidden by default */
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      margin: 0; padding: 8px 0;
      background: rgba(0,0,0,0.98);
      border-top: 2px solid rgba(255,213,74,0.3);
      z-index: 1000;
    }
    .navbar-container ul.active { display: flex; } /* Shown with .active class */

    .navbar-container ul li { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .navbar-container ul li:last-child { border-bottom: 0; }

    /* Make dropdowns inline within flow on mobile */
    .navbar .dropdown {
      position: static;
      display: none;
      padding: 6px 12px;
      background: rgba(255,255,255,0.02);
      box-shadow: none;
      border: none;
      max-height: none;
      overflow: visible;
    }
    .navbar li.open > .dropdown { display: block; }
  }
  
  @media (min-width: 769px) and (max-width: 1024px) {
    .menu-toggle { display: none; }
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Mobile menu toggle
  const menuToggle = document.querySelector('.menu-toggle');
  const navbarUl = document.querySelector('.navbar ul');
  
  if (menuToggle && navbarUl) {
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.addEventListener('click', function() {
      navbarUl.classList.toggle('active');
      const expanded = navbarUl.classList.contains('active');
      menuToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    });

    // Dropdown toggle for mobile
    navbarUl.addEventListener('click', function(e) {
      if (window.innerWidth > 768) return; // Only run on mobile

      const targetLink = e.target.closest('a.nav-item');
      const dropdown = targetLink ? targetLink.nextElementSibling : null;

      if (targetLink && dropdown && dropdown.classList.contains('dropdown')) {
        e.preventDefault(); // Prevent navigation for parent link
        const parentLi = targetLink.parentElement;
        parentLi.classList.toggle('open');
      }
    });
  }

  // Add active class to current page link
  const currentPath = window.location.pathname.endsWith('/') 
    ? window.location.pathname + 'index.html' 
    : window.location.pathname;

  const navLinks = document.querySelectorAll('.navbar a');
  
  navLinks.forEach(link => {
    const linkPath = link.getAttribute('href');
    // Normalize for comparison
    const fullLinkPath = new URL(linkPath, window.location.origin).pathname;

    if (fullLinkPath === currentPath || (fullLinkPath === '/index.html' && currentPath === '/')) {
      link.classList.add('active');
      
      const parentDropdown = link.closest('.dropdown');
      if (parentDropdown) {
        const parentMenuItem = parentDropdown.previousElementSibling;
        if (parentMenuItem) {
          parentMenuItem.classList.add('active');
          // On mobile, also open the dropdown if a child is active
          if (window.innerWidth <= 768) {
            parentMenuItem.parentElement.classList.add('open');
          }
        }
      }
    }
  });
});
</script>
