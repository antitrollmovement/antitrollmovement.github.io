<!-- Step 2: Desktop CSS Styling -->
<style>
  :root {
    --atm-yellow: #FFD60A;
    --atm-blue: #00A6FB;
    --atm-dark: #0d0d0d;
    --atm-text: #EDEDED;
  }

  /* Header Bar: Glassmorphism Style */
  .site-header {
    background: rgba(10, 10, 10, 0.75); /* Dark, semi-transparent background */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 213, 74, 0.2); /* More subtle border */
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 0 20px;
  }

  /* Container for alignment */
  .header-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between; /* Default for mobile-first */
    align-items: center;
    height: 65px;
    position: relative; /* For positioning logo/toggle */
  }

  /* Socials Button Styling */
  .socials-button {
    color: var(--atm-yellow);
    font-weight: bold;
    font-size: 0.9em;
    text-decoration: none;
    transition: all 0.3s ease;
    position: absolute;
    left: 20px;
    padding: 8px 14px;
    border: 1px solid var(--atm-yellow);
    border-radius: 8px;
  }
  .socials-button:hover {
    color: var(--atm-dark);
    background-color: var(--atm-yellow);
    box-shadow: 0 0 15px rgba(255, 213, 74, 0.5);
  }

  /* Navigation Links */
  .main-nav > ul { /* Changed from .main-nav ul to be more specific */
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 20px;
  }

  .main-nav li {
    position: relative;
  }

  .main-nav a {
    color: var(--atm-text);
    text-decoration: none;
    font-weight: bold;
    padding: 10px 15px;
    transition: color 0.3s ease, text-shadow 0.3s ease;
    border-radius: 8px;
    background: transparent; /* No background for text-style links */
  }

  .main-nav > ul > li > a:hover {
    color: var(--atm-yellow);
    text-shadow: 0 0 10px rgba(255, 213, 74, 0.7); /* Yellow glow on hover */
  }

  /* Dropdown Menu: Animated with Glow */
  .dropdown {
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    background: rgba(20, 20, 20, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 213, 74, 0.2);
    border-radius: 8px;
    padding: 8px 0;
    min-width: 200px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255, 214, 10, 0.15); /* Dark shadow + Gold glow */
    list-style: none;
    z-index: 1001;
  }

  .dropdown a {
    padding: 10px 15px;
    white-space: nowrap;
    background: none;
    color: var(--atm-text);
  }

  .dropdown a:hover {
    background: rgba(0, 166, 251, 0.1);
    color: var(--atm-blue);
  }

  .has-dropdown:hover > .dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* Active Link Styling Removed */

  /* Mobile Toggle Button */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 1001;
  }

  .hamburger-icon,
  .hamburger-icon::before,
  .hamburger-icon::after {
    content: '';
    display: block;
    background-color: var(--atm-yellow);
    height: 3px;
    width: 28px;
    border-radius: 3px;
    transition: all 0.3s ease-in-out;
  }
  .hamburger-icon::before { transform: translateY(-8px); }
  .hamburger-icon::after { transform: translateY(5px); }

  /* --- Responsive Styles --- */
  @media (min-width: 992px) {
    .header-container {
      justify-content: center; /* Center nav on desktop */
    }
    .logo {
      position: absolute; /* Position logo to the left */
      left: 20px;
    }
    .nav-toggle {
      position: absolute; /* Position toggle to the right */
      right: 20px;
    }
  }

  @media (max-width: 991px) {
    .header-container {
      justify-content: space-between;
    }
    .socials-button, .nav-toggle {
      position: static; /* Revert absolute positioning */
    }
    .socials-button {
      font-size: 0.8em; /* Make it smaller on mobile */
      padding: 6px 10px;
    }
    .nav-toggle {
      display: block;
    }
    .main-nav {
      display: none; /* Hide desktop nav on mobile */
    }
    .nav-toggle {
      display: block; /* Show hamburger on mobile */
    }
    .main-nav.mobile-active {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateY(-100%);
      animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    @keyframes slideDown {
      to { transform: translateY(0); }
    }
    .main-nav > ul {
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }
    .main-nav a {
      font-size: 1.8em;
      padding: 10px;
    }
    .dropdown {
      display: none;
      position: static;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 15px 0 0 0;
      min-width: auto;
    }
    .dropdown a {
      font-size: 0.7em;
      padding: 10px 0;
      opacity: 0.8;
    }
    .has-dropdown.open > .dropdown {
      display: block;
    }
    .has-dropdown > a::after {
      content: ' ▾';
      font-size: 0.8em;
      color: var(--atm-yellow);
    }
    .nav-toggle.active .hamburger-icon { background-color: transparent; }
    .nav-toggle.active .hamburger-icon::before { transform: translateY(0) rotate(45deg); }
    .nav-toggle.active .hamburger-icon::after { transform: translateY(-3px) rotate(-45deg); }
  }
</style>

<script>
  function initHeader() {
    const navMenu = document.querySelector('.main-nav');
    const navToggle = document.getElementById('navToggle');
    const dropdownLinks = document.querySelectorAll('.has-dropdown > a');

    if (navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('mobile-active');
        navToggle.classList.toggle('active');
        const isExpanded = navMenu.classList.contains('mobile-active');
        navToggle.setAttribute('aria-expanded', isExpanded);
        document.body.style.overflow = isExpanded ? 'hidden' : '';
      });

      dropdownLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          if (window.innerWidth < 992) {
            e.preventDefault();
            const parentLi = link.parentElement;
            parentLi.classList.toggle('open');
          }
        });
      });
    }

    // --- Active Page Highlighting Removed ---
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeader);
  } else {
    initHeader();
  }
</script>
