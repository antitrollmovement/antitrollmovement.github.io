<style>
  /* Mobile responsive styles for header */
  @media (max-width: 768px) {
    .navbar-container ul {
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #000;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .navbar-container ul.active {
      max-height: 500px;
    }
    
    .navbar-container ul li {
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .navbar-container .dropdown {
      position: static;
      box-shadow: none;
    }
    
    .menu-toggle {
      display: block;
    }
  }
  
  /* Mobile navbar: collapse to toggle, stack items, static dropdowns */
  @media (max-width: 768px) {
    .navbar { position: relative; }
    .navbar-container { position: relative; }

    .menu-toggle { display: block; }

    .navbar-container ul {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      margin: 0; padding: 8px 0;
      background: rgba(0,0,0,0.98);
      border-top: 2px solid rgba(255,213,74,0.3);
      z-index: 1000;
    }
    .navbar-container ul.active { display: flex; }

    .navbar-container ul li { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .navbar-container ul li:last-child { border-bottom: 0; }

    /* Make dropdowns inline within flow on mobile */
    .navbar .dropdown { position: static; display: none; padding: 6px 12px; background: rgba(255,255,255,0.02); }
    .navbar .nav-item:focus + .dropdown,
    .navbar .nav-item.active + .dropdown { display: block; }
  }

  @media (min-width: 769px) and (max-width: 1024px) {
    .menu-toggle { display: none; }
  }
</style>

<script>
// Mobile menu toggle
setTimeout(function() {
  const menuToggle = document.querySelector('.menu-toggle');
  const navbarUl = document.querySelector('.navbar ul');
  
  if (menuToggle && navbarUl) {
    // init
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.addEventListener('click', function() {
      navbarUl.classList.toggle('active');
      const expanded = navbarUl.classList.contains('active');
      menuToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    });
  }
}, 100);

// Add active class to current page link
document.addEventListener('DOMContentLoaded', function() {
  const currentPath = window.location.pathname;
  const navLinks = document.querySelectorAll('.navbar a');
  
  navLinks.forEach(link => {
    if (link.getAttribute('href') === currentPath) {
      link.classList.add('active');
      
      // If it's in a dropdown, highlight the parent menu item too
      const parentDropdown = link.closest('.dropdown');
      if (parentDropdown) {
        const parentMenuItem = parentDropdown.previousElementSibling;
        parentMenuItem.classList.add('active');
      }
    }
  });
});
</script>
