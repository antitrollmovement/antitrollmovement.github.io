<section class="atm-hero-banner">
  <!-- ATM Logo on Left -->
  <img src="images/atm-logo.png" alt="AntiTrollMovement Logo" class="atm-logo">

  <!-- Center Content: Bulbs and Text -->
  <div class="center-content">
    <!-- Light Bulb Row -->
    <div class="lightbulb-row" id="lightbulbRow">
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
      <div class="bulb">💡</div>
    </div>

    <!-- Main Text (underneath bulbs) -->
    <div class="main-text">
      <h1>
        ✊ The internet isn't broken 🔄 <span class="gold-text">it just needs someone to switch on the light.</span> 💡
      </h1>
    </div>
  </div>
</section>

<script>
  // Auto light animation for banner
  (function() {
    const bulbs = document.querySelectorAll('#lightbulbRow .bulb');
    
    function turnLightsOn() {
      bulbs.forEach((bulb, index) => {
        setTimeout(() => {
          bulb.classList.add('on');
        }, index * 200);
      });
    }

    // Auto-start animation after 1 second
    setTimeout(() => {
      turnLightsOn();
    }, 1000);
  })();
</script>
